name: Standards Checks

on:
  pull_request:
    branches:
      - master

jobs:
  run:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # symfony/process 8.x requires PHP >= 8.4, so the lowest supported PHP
          # exercises 7.x and the highest exercises 8.x
          - php-versions: '8.2'
            symfony-process: '7'
          - php-versions: '8.4'
            symfony-process: '8'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-versions }}-composer-

      # composer update, not install: the committed lock pins one dependency set,
      # which would give both matrix legs the same symfony/process
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Verify resolved symfony/process
        run: |
          version=$(php -r 'require "vendor/autoload.php"; echo ltrim(Composer\InstalledVersions::getPrettyVersion("symfony/process"), "v");')
          echo "Resolved symfony/process $version (expected ${{ matrix.symfony-process }}.x)"
          [ "${version%%.*}" = '${{ matrix.symfony-process }}' ] \
            || { echo "::error::expected symfony/process ${{ matrix.symfony-process }}.x, got $version"; exit 1; }

      - name: Run phpunit
        id: phpunit
        run: vendor/bin/phpunit

      - name: Report phpunit
        uses: LouisBrunner/checks-action@v2
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PHPUnit Tests
          conclusion: ${{ steps.phpunit.conclusion }}

      - name: Run pint
        id: pint
        if: always()
        run: vendor/bin/pint --test

      - name: Report pint
        uses: LouisBrunner/checks-action@v2
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Pint Coding Standards
          conclusion: ${{ steps.pint.conclusion }}
